name: PulsePay CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: ⚙️ Build API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
      - name: Instalando dependências
        run: echo "Instalando pacotes do microsserviço..." && sleep 2
      - name: Compilação
        run: echo "Build finalizado com sucesso." && sleep 2

  test:
    name: 🧪 Testes e Qualidade
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Executando testes unitários
        run: echo "Validando rotas de transferência e boletos..." && sleep 3
      - name: Análise de Débito Técnico (SonarQube)
        run: echo "Código aprovado. Sem vulnerabilidades." && sleep 2

  deploy:
    name: 🚀 Deploy Produção
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Autorização de Segurança
        run: echo "Verificando chaves de acesso..." && sleep 2
      - name: Deploy no Servidor
        run: echo "Deploy da PulsePay realizado com sucesso! O sistema não quebrou." && sleep 2
